# The resources profile every session runs under when this repository runs one itself: the
# suites (`check`) and a local `start` / `dev`. A session's own sandboxes are the ones its
# operator declares, and there is no other `default` — so this declares the one a terminal
# that names nothing lands in, and offers the GitHub connection it wants.
version: 1
resources:
  # What a repo's sandboxes want (yession.yaml's `wants: [ github ]`): the gateway, and the
  # credential proxy — which a container reaches by binding `${proxy.https}` in its own
  # declaration, or not at all.
  github:
    connection: { github: [ git, api ] }
  # `default`'s: the same connection by git alone. `default` runs under srt, which is refused the
  # api route (`CredentialProxy.forwardApi`) — so it asks for exactly what it is given.
  github-git:
    connection: { github: [ git ] }
sandboxes:
  default:
    wants: [ github-git ]
