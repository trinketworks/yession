# devenv inputs. nixpkgs is the github `nixos-unstable` branch, the same input flake.nix
# names, so Dependabot (which tracks github flake inputs, not tarballs) can move it. A
# github-restricted sandbox cannot fetch it; .claude/setup.sh rebuilds the locked source from
# the nixos.org channel tarball of the same rev instead, and the lock's narHash finds it.
# On a laptop/CI the github `devenv` input below works natively; in a github-restricted
# sandbox, a generated devenv.local.yaml repoints it at the devenv source substituted from
# cache.nixos.org (see .claude/setup.sh / AGENTS.md).
#
# The branch moves — what pins it is the committed devenv.lock. It names the same rev as
# flake.lock's nixpkgs (tests/Yession.Tests/LockSource.fs holds them together).
inputs:
  nixpkgs:
    url: github:NixOS/nixpkgs/nixos-unstable
  devenv:
    url: github:cachix/devenv?dir=src/modules
