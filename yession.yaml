# yession.yaml — what a session working on Yession selects.
#
# A repo's work sandbox is a CONTAINER (a repo-owned declaration without a `container:`
# block is refused): work runs in a full Linux userland, the same environment a person
# gets locally from this repo's flake. The TOOLCHAIN is devenv.nix's business (Node 24,
# .NET 10, Chromium, uv); the container brings only nix, and the ENTRYPOINT assembles the
# devshell from the checkout — one source of truth, no second copy of the toolchain here.
#
# The session bind-mounts its shared checkouts at /repos, so `workdir: .` is this repo's
# own checkout inside the container. Substitution comes from cache.nixos.org and the
# public yession cachix cache, named in NIX_CONFIG below: names, not paths, which is what
# keeps this file working on any machine. (First run on a fresh container is cold; the
# store warms via substitution, and an operator may offer a persistent store volume.)
#
# What is NOT here is anything the docker backend owes every container: the daemon's
# symlinked-/etc workaround and git's safe.directory for the bind-mounted checkouts are
# the backend's own consequences, applied by it (`Sandboxes.fs`) — a repo file that had
# to carry them would be copied into every repo and outlive the daemon that needed them.
#
# The session's own `default` sandbox is srt (light confinement for the checkout and
# small edits) and declares nothing here — no file may configure it.
version: 2

sandboxes:
  dev:
    # Which of the two to reach for, in the words a person would use. Both declare the same
    # container on the same image and differ only in what they are FOR, so a name is the one
    # thing that cannot tell them apart: shown both and asked to run tests, an agent picked
    # `gate`, which is the one that holds a terminal for minutes.
    description: day-to-day work — the toolchain, and where `check`, `build` and `lint`
      run; name it as `sandbox` on the command — a shell profile only sets where a shell
      here starts
    workdir: .
    container:
      image: nixos/nix
      # compose's `entrypoint`: what every piece of work in this container runs behind —
      # a terminal's shell, every block, the gate's `verify`. The devshell is assembled
      # ONCE, when a terminal's shell starts, and the shell then has the toolchain for as
      # long as it lives: no `nix develop --command` in front of every command, no
      # devenv prelude in every block's output (it prints before the shell's first
      # prompt, which no transcript records). The session's own housekeeping — its
      # start-up checks, `git` by path — runs bare, the way `docker exec` bypasses an
      # entrypoint; the toolchain is for work.
      #
      # `--impure` is not optional and not a preference: devenv resolves its root from
      # the PROCESS's working directory, which a pure evaluation does not have, so the
      # pure form fails every time with "devenv was not able to determine the current
      # directory" — on this container and on a laptop alike. Which is also why the
      # shell is spawned where this sandbox puts one (the checkout, `workdir: .`) and
      # only then `cd`s to a shell profile: the entrypoint has to start at the flake.
      #
      # No `dialect:`: the backend looks behind the entrypoint for bash, zsh and sh in
      # that order and opens the first found, which here is the devshell's bash. That
      # look is also what warms the store, once, at sandbox start rather than inside
      # whatever command happens to be first — measured at ~3.5 min of flake evaluation
      # and ~4 min of substitution cold, and it was once a `setup:` line whose whole
      # purpose was to be run behind this entrypoint before there was one.
      entrypoint: nix develop --impure --command
    forward: [ github ]              # so `git push` works from a terminal
    # A wish, not a need: where the operator offers a warm nix store volume under this
    # name, the container mounts it and the first build substitutes into a store that
    # outlives the sandbox; where nobody offers it, this line selects nothing and the
    # build runs cold. `uses:` would refuse on every host that offers none.
    wants: [ nix-container-store ]

    # Which nix features this repo's build needs, plus where its artifacts substitute
    # from. In the container this is the whole nix configuration the devshell sees —
    # there is no /etc/nix/nix.conf story to inherit, which is the point.
    #
    # The last two lines are what make nix RUN in this container at all — and they are
    # the BACKEND's consequence wearing this file's clothes: yession's docker backend
    # runs every work container under its hardened capability profile, so multi-user
    # store init (chown to nixbld) and nix's own build sandbox both die on Operation
    # not permitted. Single-user, unsandboxed nix is the container norm — the container
    # IS the sandbox. Measured under the exact profile: store writes and a real
    # derivation build both pass. If that profile ever changes, these two lines are
    # what to re-measure; every repo running nix in a yession container has to carry
    # them until the backend grows a nix-aware seam.
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        extra-substituters = https://yession.cachix.org
        extra-trusted-public-keys = yession.cachix.org-1:Dj6jHWpEaqcGyrEEC3/qy/D3UQN8sZW1RXUOCRJ41oI=
        build-users-group =
        sandbox = false

  # `verify` is minutes long. A second sandbox on the same configuration means the gate
  # runs beside interactive work instead of holding the shell.
  gate:
    description: the long `verify`, so it runs beside interactive work instead of holding
      it; not the one to reach for to run tests
    workdir: .
    container:
      image: nixos/nix
      entrypoint: nix develop --impure --command
    forward: [ github ]
    wants: [ nix-container-store ]

    # The same reasons as `dev`; `like:` does not exist yet, so both are written twice.
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        extra-substituters = https://yession.cachix.org
        extra-trusted-public-keys = yession.cachix.org-1:Dj6jHWpEaqcGyrEEC3/qy/D3UQN8sZW1RXUOCRJ41oI=
        build-users-group =
        sandbox = false
