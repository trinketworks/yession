name: dependabot-fixup

# Dependabot moves flake.lock alone; devenv.lock pins the same nixpkgs (LockSource's "pin the same
# nixpkgs"). This copies the node across on Dependabot's own pushes and commits it.
#
# The push uses DEPENDABOT_FIXUP_TOKEN (a Dependabot secret: a fine-grained token with contents:
# write), because a push with GITHUB_TOKEN starts no workflow and pr.yaml would not test it.

on:
  pull_request:
    branches: [master]
    paths: [flake.lock]

permissions:
  contents: read

jobs:
  fixup:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]'
      && github.actor == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.DEPENDABOT_FIXUP_TOKEN }}
      - name: Copy flake.lock's nixpkgs into devenv.lock, and push
        run: |
          set -euo pipefail
          node="$(jq -e '.nodes[.nodes.root.inputs.nixpkgs] | {locked, original}' flake.lock)"
          jq --indent 2 --argjson node "$node" '.nodes.nixpkgs = $node' devenv.lock > devenv.lock.new
          mv devenv.lock.new devenv.lock
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: devenv.lock follows flake.lock's nixpkgs"
          git push
