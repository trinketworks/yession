name: bench

# What a person waits for, measured — and whether it is getting worse.
#
# `check` proves behaviour and says nothing about time, which leaves a whole class of change
# invisible. This job measures the editor and collaboration path across three document sizes
# (`tasks.fsx bench`), optionally judges the result against the recorded history
# (`bench-guard`), and optionally records it (`bench-publish`). The two options are what let
# the same file serve two very different callers:
#
#   * pull requests   guard: true,  record: false  — catch a regression before it merges
#   * master releases guard: false, record: true   — chart it, and never block a release
#
# That split is deliberate. A regression should be caught by the person who caused it, on their
# own pull request, where a red is cheap and actionable. A red on master stops everybody else
# releasing, and a benchmark is not a good enough reason to hold delivery — anything that got
# past the pull-request guard is a chart to read, not a release to block.
#
# The history lives on the orphan `bench` branch, one JSON line per release. Orphan so it never
# touches master's history and never triggers release.yml (`branches: [master]`).

on:
  workflow_call:
    inputs:
      guard:
        description: Fail the job when a metric is far above its recorded baseline.
        type: boolean
        default: false
      record:
        description: Append this measurement to the `bench` branch and redraw the chart.
        type: boolean
        default: false
  # Run by hand, against whatever ref is being worked on — the same argument verify.yml makes.
  # Measuring a change before merging it is the whole point of having a number.
  workflow_dispatch:
    inputs:
      guard:
        description: Fail when a metric is far above its recorded baseline.
        type: boolean
        default: true
      record:
        description: Record this measurement. Leave off for a branch — the history is master's.
        type: boolean
        default: false

# One measurement per COMMIT. Two benchmarks sharing a runner measure each other, and the sha is
# what keeps that true without the group meaning something else on master: `github.ref` is
# `refs/heads/master` for every push, so per-ref this cancelled the previous release's measurement
# — and a cancelled job in a called workflow cancels the whole RUN, which skips the release.
# verify.yml carries the same correction and the story of the run that proved it.
#
# Nothing is lost for a pull request, which is the case the cancelling was for: pr.yaml already
# groups per pull request and cancels in progress, so a new push supersedes the entire run,
# measurement included, before this group is ever consulted.
concurrency:
  group: bench-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

# No `permissions` block, deliberately, and this is the one thing about this file that is not
# obvious. A called workflow can only REDUCE its caller's token; asking for more is not a
# runtime error but a startup_failure — the whole run refuses to load, with no jobs and nothing
# in the log to read. `contents: write` here did exactly that to the pull-request gate, because
# pr.yaml declares no permissions and so gets the repository default.
#
# So the caller decides: release.yml declares `contents: write` at its top and `bench-publish`
# pushes the orphan branch under it; pr.yaml grants nothing extra and does not record. That is
# also verify.yml's arrangement, and the reason to match it rather than invent a second one.
#
# `lint` does not catch this: actionlint type-checks a workflow in isolation and has no view of
# what a caller will grant.

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The history IS the version, and `bench-publish` computes the label it records from it
          # (tasks.fsx's policy, the same function package:npm calls) — which refuses a shallow
          # clone rather than emitting a number computed from a truncated log. This used to be
          # depth 1, because the label arrived as a string from the caller and nothing here had to
          # know what a version was.
          #
          # The `bench` branch that holds the recorded history is no longer fetched here either:
          # every verb that reads it fetches it (tasks.fsx `fetchBenchHistory`), which is where the
          # need is. A step here did it with `--depth=50` — and a shallow fetch of any ref marks the
          # whole repository shallow, which is exactly what the version computation refuses.
          fetch-depth: 0
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # A cache push may not fail the job (verify.yml's step says why).
      - uses: cachix/cachix-action@v17
        continue-on-error: true
        with:
          name: yession
          extraPullNames: devenv
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # `nixpkgs#devenv` resolves through the flake registry to the nixpkgs-unstable CHANNEL,
      # so which devenv CI ran was a moving target: the toolchain could change under this
      # repository with no commit, and two runs of one commit could disagree about it.
      # devenv.lock already names an immutable nixpkgs for the dev shell, so the CLI is taken
      # from there rather than pinned a second time here — one pin, moved by `devenv update`
      # alone, and a CLI that can never disagree with the shell it evaluates about which
      # nixpkgs they are. The url is captured before it is used, because a substitution read
      # inline has its exit status discarded (tasks.fsx's version policy tells that story).
      - name: Install devenv
        run: |
          set -euo pipefail
          url="$(jq -er '.nodes.nixpkgs.locked.url' devenv.lock)"
          nix profile install "tarball+$url#devenv"
      # Before anything depends on the shell, and retried: see the action for the failure it
      # absorbs and why one warm-up covers a whole job.
      - name: Warm the devenv shell
        uses: ./.github/actions/devenv-warm
      # `bench` provisions Chromium itself (the same PLAYWRIGHT_BROWSERS_PATH every browser tier
      # uses) and runs only the `Client performance` suite — no host, no WebRTC, no addon.
      # Best effort whenever nothing is being guarded, which is the release's case: a benchmark
      # is never a good enough reason to hold delivery, and `continue-on-error` cannot go on the
      # job that calls this workflow. When `guard` IS on — a pull request — a failed measurement
      # fails the job, because a guard that cannot measure has not cleared anything.
      - name: Measure
        id: measure
        continue-on-error: ${{ !inputs.guard }}
        run: devenv shell -- bench
      # Separate from the measurement, because judging and measuring are different jobs and only
      # one of the two callers wants both. `bench-guard` re-measures once before failing, so a
      # single unlucky sample cannot turn into a red pull request.
      - name: Judge against the recorded baseline
        if: inputs.guard
        run: devenv shell -- bench-guard
      # Only what was actually measured is recorded: when the measurement was tolerated into
      # failing (the release's case), there is no `dist/bench.json` to append and a history that
      # skips a release is honest, while one carrying a run that did not happen is not.
      # The label is `bench-publish`'s own to compute, out of the version policy in tasks.fsx, for
      # the reason every other version in this repository is computed there: a second reader is a
      # second answer, and the caller that used to pass one down could pass an EMPTY one — which
      # is why this step carried a refusal of its own. The computation cannot produce an empty
      # string (it refuses a shallow clone and an unreadable tag instead), so there is one
      # mechanism at one point again rather than a guard standing in for a caller's mistake.
      - name: Record and redraw
        if: inputs.record && steps.measure.outcome == 'success'
        continue-on-error: ${{ !inputs.guard }}
        run: |
          set -euo pipefail
          git config user.name "yession-bench"
          git config user.email "bench@yession.invalid"
          devenv shell -- bench-publish
      - uses: actions/upload-artifact@v4
        # Always, so a guard failure still leaves the numbers that caused it behind to read.
        if: always()
        with:
          name: bench
          path: |
            dist/bench.json
            dist/bench.svg
          if-no-files-found: ignore
