# The fable SIGSEGV, chased on real runners (see the crash-repro section of tasks.fsx).
#
# On demand only, and never a gate: it exists to turn a once-in-a-hundred release failure into
# a rate, so that a fix can be shown to move it. Every job runs `tasks.fsx crash-repro` inside
# the nix build sandbox — where all three crashes happened — on both architectures the release
# builds, `shards` times each, side by side. A red job carries the crash report in its log.
#
#   gh workflow run crash-repro.yml -f layer=regex
#   gh workflow run crash-repro.yml -f layer=fable -f rounds=5 -f shards='[1,2,3,4]'
#   gh workflow run crash-repro.yml -f layer=fable -f env=DOTNET_TieredCompilation=0 -f arches='["x86_64-linux"]'
name: crash-repro

on:
  workflow_dispatch:
    inputs:
      layer:
        description: "regex (the emit churn alone, seconds to start) or fable (the real compile)"
        type: choice
        options: [regex, fable]
        default: regex
      rounds:
        description: "Rounds of children per job"
        default: "20"
      workers:
        description: "Children side by side per round"
        default: "4"
      seconds:
        description: "Seconds each regex child churns for (ignored by fable)"
        default: "60"
      heap_mb:
        description: "Live heap each regex child holds and rewrites, in MB (ignored by fable)"
        default: "2000"
      env:
        description: "Space-separated NAME=value settings for every child, e.g. DOTNET_gcServer=1"
        default: ""
      shards:
        description: "JSON list, one job per entry per architecture"
        default: "[1,2,3,4,5,6,7,8]"
      arches:
        description: "JSON list of architectures to run on"
        default: '["x86_64-linux","aarch64-linux"]'

permissions:
  contents: read

jobs:
  repro:
    name: "crash-repro ${{ inputs.layer }} ${{ inputs.env }} (${{ matrix.arch }} #${{ matrix.shard }})"
    # A runner per architecture by expression, not a matrix `include`: an include naming an
    # architecture that `arches` left out would add that job back.
    runs-on: ${{ matrix.arch == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
        arch: ${{ fromJSON(inputs.arches) }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Pull only: the dependencies come from the cache, and a repro result is nothing to keep.
      - uses: cachix/cachix-action@v17
        continue-on-error: true
        with:
          name: yession
          skipPush: true
      # The shard is passed through so that no two jobs could ever share a store path, which
      # also makes a re-run of one job a fresh build rather than a cache hit.
      - name: Run the repro in the build sandbox
        env:
          LAYER: ${{ inputs.layer }}
          ROUNDS: ${{ inputs.rounds }}
          WORKERS: ${{ inputs.workers }}
          SECONDS_: ${{ inputs.seconds }}
          HEAP_MB: ${{ inputs.heap_mb }}
          CHILD_ENV: ${{ inputs.env }}
          SHARD: ${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          nix build --impure --print-build-logs --no-link --expr "
            ((import ./nix/worktree.nix).crashRepro.override {
              layer = \"$LAYER\"; rounds = \"$ROUNDS\"; workers = \"$WORKERS\"; seconds = \"$SECONDS_\";
              heapMb = \"$HEAP_MB\"; env = \"$CHILD_ENV\";
            }).overrideAttrs { YESSION_CRASH_REPRO_SHARD = \"$SHARD\"; }"
