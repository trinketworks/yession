name: verify

# The full verification gate, in its own file, so it can be run ON PURPOSE against any branch.
#
# `Docker` (needs a daemon) and `LiveAgent` (needs a real model credential) are the two
# capabilities a pull request cannot satisfy, so before this file existed the only thing that
# ever ran them was a master push. Developing anything that needs one meant merging to find
# out — and the live clone suite is what that costs: two merges, two red releases, and no
# per-case diagnosis from either, because the only tier that could run it was the one whose
# red stops everybody else from releasing.
#
# ONE definition, two callers: release.yml calls this on every master push, and a person or an
# agent dispatches it from the Actions tab (or `gh workflow run`) against a branch. Keeping the
# gate in one file is what stops the on-demand run from quietly becoming a weaker check than
# the one guarding master — the whole point is to run the SAME thing, earlier.
#
# Dispatching against a branch runs THAT branch's suite, but GitHub only offers the button for
# workflows present on the default branch: this file has to be on master before a branch can be
# dispatched against it. That is a one-time cost, and it is why this landed on its own.

on:
  # Called by release.yml. Both inputs are left at their defaults there: master gets the whole
  # gate, always, and a release that could narrow its own gate would not be one.
  workflow_call:
    inputs:
      capabilities:
        description: One capability tier to run, in one job. Blank runs the whole gate, as its declared tiers.
        type: string
        default: ""
      only:
        description: Narrow both runtimes to cases whose full name contains this text.
        type: string
        default: ""
  # Run by hand, against whatever ref is being worked on.
  workflow_dispatch:
    inputs:
      capabilities:
        description: 'Capabilities, space-separated (e.g. "LiveAgent Ports Native Srt"), run as ONE job. Blank runs the whole gate, as its declared tiers.'
        type: string
        default: ""
      only:
        description: 'Narrow to cases whose name contains this text (e.g. "add_repo"). Needs capabilities to be named.'
        type: string
        default: ""

# One gate per COMMIT, and the sha is the whole point of the group — it used to be the ref alone,
# and that was a release-killer hiding behind another lock.
#
# `github.ref` is `refs/heads/master` for every master push, so two release runs both called this
# workflow into ONE group with `cancel-in-progress: true`, and the newer cancelled the older's
# gate mid-run. It could not bite while release.yml serialised the whole workflow, because two
# master gates could never overlap; the moment that lock was narrowed to the tag cut, the very
# first overlapping pair proved it — run 35603572519 (711cfa4) had `node` and `browser` green and
# `nix` still running when the next push arrived, and `nix` was cancelled 51 seconds later. Every
# job downstream skipped and that commit was never released.
#
# So the group is per-commit. A dispatch still supersedes its own earlier dispatch of the same
# commit, which is what that was for; a dispatch after a new push is a different gate over
# different source and has no business cancelling the one before it.
#
# `Release gate` (cheap tier) holds every workflow release.yml calls to this, because the fault is
# invisible until two pushes happen to overlap and then reads as an unexplained cancellation.
#
# The tiers below run at the same time and this says nothing about them: each is a job, and a job
# is its own ephemeral VM. What must not overlap is two runs on one MACHINE, which is a different
# question from two jobs on two.
concurrency:
  group: verify-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  # Which tiers this run is. One job apiece, so the gate's three independent halves stop queueing
  # behind each other: the Node suites, the .NET CLR (browser) suites, and the Nix build share no
  # output — each re-compiles what it needs — and ran sequentially in one job for no reason beyond
  # `verify` being one word. Measured on 94a72ba: 76s solution build, 42s browser client, 71s
  # stage, 83s suite compile, 208s Node suites, 178s browser suites, 249s Nix build — 15m21s of
  # strictly serial work, where the widest tier is under 10 minutes.
  #
  # The tiers live in `.github/verify-tiers.json` rather than here because splitting a gate is how
  # a gate quietly stops being one: a tier is a list of capability names, and a suite whose needs
  # no tier satisfies runs NOWHERE and reports nothing, leaving a green run indistinguishable from
  # a complete one. `Verify tiers` (cheap tier, `tests/Yession.Tests/VerifyTiers.fs`) reads that
  # same file against every suite the test assembly declares and refuses the hole on every pull
  # request. One declaration, two readers, and neither of them a copy.
  #
  # A dispatch that names capabilities collapses to ONE tier running exactly those: somebody
  # asking for `check Docker Dogfood` wants that run, not three with two of them refusing.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.tiers.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: tiers
        env:
          # Read as data rather than interpolated into the script, for the reason the gate step
          # below gives: a dispatch input is a string somebody typed.
          CAPABILITIES: ${{ inputs.capabilities }}
        # A whole `matrix` object rather than a list for `include:`, because `matrix:
        # ${{ fromJSON(…) }}` is the form GitHub documents for a matrix computed by a job, and a
        # matrix that does not parse is a startup_failure with no log to read. The file stays a
        # plain array — that is what a reader (and `Verify tiers`) wants — and the wrapping happens
        # here, where the shape is a fact about Actions rather than about the gate.
        #
        # `jq -c`, so the output is one line; `--arg`, so a capability list carrying a quote is
        # encoded rather than pasted. Captured into a variable before it is echoed, because a
        # command substitution's exit status is discarded when it is an argument (tasks.fsx's
        # version policy tells that story at length), and `-e` would never see the failure.
        run: |
          set -euo pipefail
          if [ -n "$CAPABILITIES" ]; then
            matrix="$(jq -cn --arg caps "$CAPABILITIES" '{ include: [ { tier: "dispatch", capabilities: $caps } ] }')"
          else
            matrix="$(jq -ce '{ include: . }' .github/verify-tiers.json)"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  verify:
    needs: plan
    name: ${{ matrix.tier }}
    strategy:
      # Every tier reports. A tier that fails must not take the others' verdicts with it: the
      # whole point of splitting was to learn three things per run instead of the first one.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # Master builds what pull requests consume. The derivations this repository defines have no
      # public cache — libdatachannel and node-datachannel are C++ builds, and every pull request
      # compiled them from scratch until they were published here. Nix keys by derivation hash, so
      # a stale entry is never consulted: this can miss, it cannot serve a wrong answer.
      # And it may not FAIL a job either. The daemon pushes paths as they are built and drains
      # at post-job time; a drain that does not finish inside its minute exits 3 ("Failed 1
      # stuck jobs after drain timeout"), which reddened a gate whose every suite had passed
      # (release run 777) and a release whose package had already built and pushed (run 847).
      # A path that missed the cache costs the next run compile time and nothing else, so it
      # must not cost a red one. `continue-on-error` reaches the post step, which is where the
      # drain runs, because the runner's post step reads the same step's setting; it covers
      # this step's own failure too, which is the same trade — a bad token stops the cache
      # filling rather than stopping delivery.
      - uses: cachix/cachix-action@v17
        continue-on-error: true
        with:
          name: yession
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # `nixpkgs#devenv` resolves through the flake registry to the nixpkgs-unstable CHANNEL,
      # so which devenv CI ran was a moving target: the toolchain could change under this
      # repository with no commit, and two runs of one commit could disagree about it.
      # devenv.lock already names an immutable nixpkgs for the dev shell, so the CLI is taken
      # from there rather than pinned a second time here — one pin, moved by `devenv update`
      # alone, and a CLI that can never disagree with the shell it evaluates about which
      # nixpkgs they are. The url is captured before it is used, because a substitution read
      # inline has its exit status discarded (tasks.fsx's version policy tells that story).
      - name: Install devenv
        run: |
          set -euo pipefail
          url="$(jq -er '.nodes.nixpkgs.locked.url' devenv.lock)"
          nix profile install "tarball+$url#devenv"
      # Before anything depends on the shell, and retried: see the action for the failure it
      # absorbs and why one warm-up covers a whole job.
      - name: Warm the devenv shell
        uses: ./.github/actions/devenv-warm
      # The Docker integration suite talks to the daemon (dockerode over the local socket). This
      # job runs on the VM host (no `container:` key), so the preinstalled daemon is reachable
      # directly — and the `node` tier asks for Docker, so an unreachable one fails that tier
      # rather than skipping. The `browser` tier's `check Browser` provisions Chromium itself, so
      # no separate Chromium step is needed either.
      #
      # Every step here runs for every tier, deliberately: which tier this job is, is a matrix
      # value read at the gate step, and a per-tier setup would be three arrangements to keep in
      # step with one file's worth of reasons. A daemon the `nix` tier never asks for costs it
      # nothing.
      # The confining sandbox backend needs a NESTED user namespace for its strict profile, and
      # Ubuntu 24.04's `kernel.apparmor_restrict_unprivileged_userns=1` forbids one — without
      # this the release gate drops the `Srt` capability and the escape probes never run. The
      # runner is an ephemeral VM; nothing about the product changes.
      - name: Permit nested user namespaces (the sandbox escape probes need them)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Verification gate
        env:
          # The credential the live agent suites run on. This job used to name
          # CLAUDE_CODE_OAUTH_TOKEN, which is not a secret this repository has, so the variable
          # arrived empty — and back when an unavailable capability was silently dropped, that
          # meant every release up to v5.0.0-beta.0 shipped green with the live agent suite
          # skipped. The `node` tier asks for LiveAgent, so an empty credential fails it.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Read as data rather than interpolated into the script: a dispatch input is a string
          # somebody typed, and the one place it must not land is inside the shell this composes.
          # The tier's capabilities take the same route, because on a dispatch they ARE that
          # string.
          CAPABILITIES: ${{ matrix.capabilities }}
          # A tier that runs one of the suite's two runtimes says which (`check --runtime`); a
          # tier that names none runs both, as a dispatch does.
          RUNTIME: ${{ matrix.runtime }}
          ONLY: ${{ inputs.only }}
        # On this headless runner `check` self-wraps in a private D-Bus session +
        # gnome-keyring (both provided by devenv) to stand in for a desktop Secret
        # Service, so the OS-credential-manager suite runs for real.
        #
        # Always `check <capabilities>`, never the bare `verify` verb: a tier is a subset of the
        # gate by construction, and the tasks.fsx verb means every capability at once — which is
        # still what a laptop runs, and is what `Verify tiers` holds these tiers to the sum of.
        run: |
          # Deliberately unquoted: the value is a space-separated list of capability names,
          # and `check` takes them as separate arguments.
          # shellcheck disable=SC2086
          set -- check $CAPABILITIES
          if [ -n "$RUNTIME" ]; then
            set -- "$@" --runtime "$RUNTIME"
          fi
          if [ -n "$ONLY" ]; then
            set -- "$@" --only "$ONLY"
          fi
          echo "running: devenv shell -- $*"
          devenv shell -- "$@"
      # Reused runners must not leak session containers/volumes between jobs.
      - name: Clean up Yession Docker artefacts
        if: always()
        run: devenv shell -- clean-docker
