# Weekly version updates, each held back 7 days after release. The lockfiles Dependabot moves are
# what nix/packages.nix builds from. dependabot-fixup.yml keeps devenv.lock's nixpkgs in step.
version: 2
updates:
  - package-ecosystem: nix
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }

  - package-ecosystem: nuget
    directories: [/, /examples/serial]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      nuget: { update-types: [minor, patch] }
    # .config/dotnet-tools.json has no lockfile, so nugetTools keeps a hand hash: bump by hand.
    ignore:
      - dependency-name: fable
      - dependency-name: fsharp-analyzers

  - package-ecosystem: npm
    directories: [/, /examples/serial]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      npm: { update-types: [minor, patch] }

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/devenv-warm]
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }
